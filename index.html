<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030b16">
  <title>수협 AI 교육</title>
  <meta name="description" content="수협 AI 교육 자료실">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/png" href="assets/logo.png">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="glow" aria-hidden="true"></div>
      <div class="container hero-content">
        <img class="brand-mark" src="assets/logo.png" alt="수협 로고">
        <p class="eyebrow">SUHYUP AI TRAINING</p>
        <h1>수협 <span class="accent">AI 교육</span></h1>
      </div>
      <div class="waves" aria-hidden="true">
        <svg class="wave wave-back" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 60c120-30 240-30 360 0s240 30 360 0 240-30 360 0 240 30 360 0v60H0z"/></svg>
        <svg class="wave wave-front" viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 80c120-22 240-22 360 0s240 22 360 0 240-22 360 0 240 22 360 0v40H0z"/></svg>
      </div>
    </section>

    <section class="container cards-wrap">
      <ul class="card-grid" id="cardGrid" aria-live="polite"></ul>
    </section>
  </main>

  <script src="assets/main.js"></script>
</body>
</html>
